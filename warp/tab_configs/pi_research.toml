# Tab Config: pi-research agent (Docker sandbox)
# Install: copy to ~/.warp/tab_configs/  (macOS stable)

name = "pi-research"
title = "pi-research"
color = "green"

[[panes]]
id = "main"
type = "terminal"
directory = "~/pi-configs"
commands = ["docker compose -f ~/pi-configs/compose.yml run --rm pi-research"]
is_focused = true
