# Tab Config: pi-coding agent (Docker sandbox)
# Install: copy to ~/.warp/tab_configs/  (macOS stable)

name = "pi-coding"
title = "pi-coding"
color = "blue"

[[panes]]
id = "main"
type = "terminal"
directory = "~/pi-configs"
commands = ["docker compose -f ~/pi-configs/compose.yml run --rm pi-coding"]
is_focused = true
