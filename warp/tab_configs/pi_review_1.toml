# Tab Config: pi-review-1 agent (Docker sandbox)
# Install: copy to $HOME/.warp/tab_configs/  (macOS stable)
# The compose service command includes --continue, so each launch resumes
# this agent's most recent session (fresh start: /new inside pi).
# agent_run.sh enforces one instance per agent: if the agent is already
# running (its tab already open), the new tab just prints a notice.

name = "pi-review-1"
title = "pi-review-1"
color = "cyan"

[[panes]]
id = "main"
type = "terminal"
# no 'directory': Warp's directory field expands only ~ and {{param}} — not
# env vars — and agent_run.sh self-locates the repo from its own path.
commands = ["${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/warp/agent_run.sh pi-review-1"]
	is_focused = true
