# Tab Config: pi-review agent (Docker sandbox)
# Install: copy to ~/.warp/tab_configs/  (macOS stable)
# The compose service command includes --continue, so each launch resumes
# this agent's most recent session (fresh start: /new inside pi).
# agent_run.sh enforces one instance per agent: if the agent is already
# running (its tab already open), the new tab just prints a notice.

name = "pi-review"
title = "pi-review"
color = "cyan"

[[panes]]
id = "main"
type = "terminal"
directory = "~/pi-configs"
commands = ["~/pi-configs/warp/agent_run.sh pi-review"]
is_focused = true
