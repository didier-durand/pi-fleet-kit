# Tab Config: pi-personal agent (Docker sandbox)
# Install: copy to ~/.warp/tab_configs/  (macOS stable)
# The compose service command includes --continue, so each launch resumes
# this agent's most recent session (fresh start: /new inside pi).

name = "pi-personal"
title = "pi-personal"
color = "magenta"

[[panes]]
id = "main"
type = "terminal"
directory = "~/pi-configs"
commands = ["docker compose -f ~/pi-configs/compose.yml run --rm pi-personal"]
is_focused = true
