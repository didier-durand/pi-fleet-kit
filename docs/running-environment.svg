<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#667085"/>
    </marker>
  </defs>

  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">pi-fleet-kit — running environment</text>
  <text x="620" y="60" text-anchor="middle" font-size="12" fill="#6B7280">five autonomous Pi agents in Docker sandboxes, operated from Warp, wired to GitHub, npm and LLM APIs</text>

  <!-- ================= HOST ================= -->
  <rect x="40" y="80" width="1160" height="250" rx="10" fill="#F5F9FF" stroke="#4A78B5" stroke-width="1.5"/>
  <text x="56" y="104" font-size="13" font-weight="700" fill="#2B4C7E">HOST</text>
  <text x="106" y="104" font-size="11" fill="#5A6B85">macOS · Linux · Windows — Docker Desktop / Docker Engine</text>

  <!-- Warp sub-box -->
  <rect x="60" y="120" width="560" height="190" rx="8" fill="#FFFFFF" stroke="#9DB6D8"/>
  <text x="76" y="142" font-size="12" font-weight="700" fill="#1F2937">Warp terminal</text>
  <text x="76" y="160" font-size="11" fill="#475569">Tab Configs (tab_configs/*.toml) → one tab per agent:</text>
  <g font-size="10" text-anchor="middle">
    <rect x="76"  y="170" width="96" height="22" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="124" y="185" fill="#92400E">pi-fleet-kit</text>
    <rect x="180" y="170" width="96" height="22" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="228" y="185" fill="#1E40AF">pi-coding</text>
    <rect x="284" y="170" width="96" height="22" rx="6" fill="#CFFAFE" stroke="#0E7490"/><text x="332" y="185" fill="#155E75">pi-review</text>
    <rect x="388" y="170" width="96" height="22" rx="6" fill="#DCFCE7" stroke="#15803D"/><text x="436" y="185" fill="#166534">pi-research</text>
    <rect x="492" y="170" width="96" height="22" rx="6" fill="#FCE7F3" stroke="#BE185D"/><text x="540" y="185" fill="#9D174D">pi-personal</text>
  </g>
  <text x="76" y="214" font-size="10.5" fill="#334155">each tab → <tspan font-weight="600">agent_run.sh <agent></tspan> → docker compose run --rm</text>
  <text x="76" y="232" font-size="10.5" fill="#334155"><tspan font-weight="600">agents_start.sh</tspan>: opens every missing tab, heals orphans, verifies each agent came up</text>
  <text x="76" y="250" font-size="10.5" fill="#334155">one instance per agent: heartbeat claim + fixed container name — no duplicates, no orphans</text>
  <text x="76" y="272" font-size="10.5" fill="#334155">macOS: <tspan font-weight="600">Pi Agent Fleet</tspan> Dock app (build_fleet_app.sh · swiftc) — one click runs the fleet</text>
  <text x="76" y="294" font-size="10.5" fill="#334155">tabs_install.sh installs configs (per-OS dir) · fleet_doctor.sh diagnoses startup issues</text>

  <!-- Host files sub-box -->
  <rect x="640" y="120" width="540" height="190" rx="8" fill="#FFFFFF" stroke="#9DB6D8"/>
  <text x="656" y="142" font-size="12" font-weight="700" fill="#1F2937">Host files & shell environment</text>
  <g font-size="10.5" fill="#334155">
    <text x="656" y="164"><tspan font-weight="600">~/pi-fleet-kit</tspan> — this repo: compose.yml · Dockerfile.pi · extensions/ · skills/</text>
    <text x="656" y="182"><tspan font-weight="600">~/pi-agents/<agent></tspan> — per-agent workspace (independent git clone)</text>
    <text x="656" y="200"><tspan font-weight="600">~/pi-exchange/pi-coding · pi-review</tspan> — watchdog drop dirs (prompt files)</text>
    <text x="656" y="218"><tspan font-weight="600">~/.ssh/pi-agent-signing</tspan> — signing-only SSH key (commits → Verified)</text>
    <text x="656" y="240">shell env: OPENROUTER_API_KEY · GITHUB_TOKEN · GITHUB_USER_NAME / EMAIL</text>
    <text x="656" y="258">.env — ${VAR} references only, resolved by compose at launch</text>
    <text x="656" y="280">git hooks: core.hooksPath .githooks — pre-commit secret-leak guard</text>
  </g>

  <!-- host -> docker arrow -->
  <line x1="620" y1="330" x2="620" y2="396" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="636" y="352" font-size="10.5" fill="#475569">docker compose run --rm --name <agent> --label pi.agent.fleet=1</text>
  <text x="636" y="369" font-size="10.5" fill="#475569">env passthrough · named volumes · bind mounts (ro: skills, extensions, key)</text>

  <!-- ================= DOCKER ================= -->
  <rect x="40" y="400" width="1160" height="290" rx="10" fill="#F7F4FD" stroke="#6A4FA3" stroke-width="1.5"/>
  <text x="56" y="424" font-size="13" font-weight="700" fill="#4C3575">DOCKER ENGINE</text>
  <text x="180" y="424" font-size="11" fill="#5D4E86">compose project: pi-agents · one container per agent · image: pi-sandbox</text>

  <!-- container: pi-fleet-kit -->
  <g>
    <rect x="80" y="440" width="208" height="200" rx="8" fill="#FFFFFF" stroke="#C4B18F"/>
    <rect x="88" y="448" width="192" height="20" rx="5" fill="#FEF3C7"/>
    <text x="184" y="462" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">pi-fleet-kit</text>
    <g font-size="9.5" fill="#475569">
      <text x="92" y="486">volume: pi-fleet-kit-home</text>
      <text x="92" y="501">→ /home/pi/.pi/agent</text>
      <text x="92" y="521">~/pi-agents/pi-fleet-kit</text>
      <text x="92" y="536">→ /workspace</text>
      <text x="92" y="556">skills · extensions (ro)</text>
      <text x="92" y="571">→ /repo-skills · /repo-extensions</text>
      <text x="92" y="591">runs: git-status, prompt-trigger</text>
      <text x="92" y="606">(dormant: no /exchange)</text>
    </g>
  </g>
  <!-- container: pi-coding -->
  <g>
    <rect x="308" y="440" width="208" height="200" rx="8" fill="#FFFFFF" stroke="#8FAEE0"/>
    <rect x="316" y="448" width="192" height="20" rx="5" fill="#DBEAFE"/>
    <text x="412" y="462" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E40AF">pi-coding</text>
    <g font-size="9.5" fill="#475569">
      <text x="320" y="486">volume: pi-coding-home</text>
      <text x="320" y="501">→ /home/pi/.pi/agent</text>
      <text x="320" y="521">~/pi-agents/pi-coding</text>
      <text x="320" y="536">→ /workspace</text>
      <text x="320" y="556">skills · extensions (ro)</text>
      <text x="320" y="571">→ /repo-skills · /repo-extensions</text>
      <text x="320" y="591">~/pi-exchange/pi-coding</text>
      <text x="320" y="606">→ /exchange (prompt-trigger)</text>
    </g>
  </g>
  <!-- container: pi-review -->
  <g>
    <rect x="536" y="440" width="208" height="200" rx="8" fill="#FFFFFF" stroke="#7FBFCB"/>
    <rect x="544" y="448" width="192" height="20" rx="5" fill="#CFFAFE"/>
    <text x="640" y="462" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155E75">pi-review</text>
    <g font-size="9.5" fill="#475569">
      <text x="548" y="486">volume: pi-review-home</text>
      <text x="548" y="501">→ /home/pi/.pi/agent</text>
      <text x="548" y="521">~/pi-agents/pi-review</text>
      <text x="548" y="536">→ /workspace</text>
      <text x="548" y="556">skills · extensions (ro)</text>
      <text x="548" y="571">→ /repo-skills · /repo-extensions</text>
      <text x="548" y="591">~/pi-exchange/pi-review</text>
      <text x="548" y="606">→ /exchange (prompt-trigger)</text>
    </g>
  </g>
  <!-- container: pi-research -->
  <g>
    <rect x="764" y="440" width="208" height="200" rx="8" fill="#FFFFFF" stroke="#93C89F"/>
    <rect x="772" y="448" width="192" height="20" rx="5" fill="#DCFCE7"/>
    <text x="868" y="462" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">pi-research</text>
    <g font-size="9.5" fill="#475569">
      <text x="776" y="486">volume: pi-research-home</text>
      <text x="776" y="501">→ /home/pi/.pi/agent</text>
      <text x="776" y="521">~/pi-agents/pi-research</text>
      <text x="776" y="536">→ /workspace</text>
      <text x="776" y="556">skills · extensions (ro)</text>
      <text x="776" y="571">→ /repo-skills · /repo-extensions</text>
      <text x="776" y="591">skills: publishing · web-research</text>
      <text x="776" y="606">+ github-best-practices</text>
    </g>
  </g>
  <!-- container: pi-personal -->
  <g>
    <rect x="992" y="440" width="208" height="200" rx="8" fill="#FFFFFF" stroke="#DCA6C4"/>
    <rect x="1000" y="448" width="192" height="20" rx="5" fill="#FCE7F3"/>
    <text x="1096" y="462" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9D174D">pi-personal</text>
    <g font-size="9.5" fill="#475569">
      <text x="1004" y="486">volume: pi-personal-home</text>
      <text x="1004" y="501">→ /home/pi/.pi/agent</text>
      <text x="1004" y="521">~/pi-agents/pi-personal</text>
      <text x="1004" y="536">→ /workspace</text>
      <text x="1004" y="556">skills · extensions (ro)</text>
      <text x="1004" y="571">→ /repo-skills · /repo-extensions</text>
      <text x="1004" y="591">skills: publishing · hello-world</text>
      <text x="1004" y="606">+ github-best-practices</text>
    </g>
  </g>

  <text x="620" y="672" text-anchor="middle" font-size="10" fill="#5D4E86">Dockerfile.pi: node:24-slim · git · ripgrep · openssh · pi (global) · entrypoint.sh: git identity + token credential helper + SSH signing + PI_PACKAGES install · runs as unprivileged user “pi”</text>

  <!-- docker -> external arrows -->
  <line x1="220" y1="690" x2="220" y2="728" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="232" y="714" font-size="9.5" fill="#8A6414">LLM API calls</text>
  <line x1="630" y1="690" x2="630" y2="728" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="642" y="714" font-size="9.5" fill="#8A6414">git over HTTPS · SSH-signed commits</text>
  <line x1="1030" y1="690" x2="1030" y2="728" stroke="#667085" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1042" y="714" font-size="9.5" fill="#8A6414">pi install</text>

  <!-- ================= EXTERNAL ================= -->
  <rect x="40" y="730" width="360" height="130" rx="10" fill="#FFF8EC" stroke="#C08A2D" stroke-width="1.5"/>
  <text x="56" y="754" font-size="12" font-weight="700" fill="#7A5410">LLM providers (OpenRouter)</text>
  <g font-size="10.5" fill="#4A5568">
    <text x="56" y="778">model: openrouter/… — set per agent in compose.yml</text>
    <text x="56" y="798">OPENROUTER_API_KEY read by pi's openrouter provider</text>
    <text x="56" y="818">streaming turns; keys only pass through env,</text>
    <text x="56" y="836">never baked into images or .env</text>
  </g>

  <rect x="440" y="730" width="380" height="130" rx="10" fill="#F2FAF2" stroke="#3C8C4E" stroke-width="1.5"/>
  <text x="456" y="754" font-size="12" font-weight="700" fill="#256B36">GitHub</text>
  <g font-size="10.5" fill="#33413A">
    <text x="456" y="778">each agent workspace is an independent git clone</text>
    <text x="456" y="798">clone / pull / push over HTTPS (GITHUB_TOKEN credential helper)</text>
    <text x="456" y="818">SSH-signed commits → Verified badge (signing-only key)</text>
    <text x="456" y="838">git-status footer shows each agent's own repo state</text>
  </g>

  <rect x="860" y="730" width="340" height="130" rx="10" fill="#FFF8EC" stroke="#C08A2D" stroke-width="1.5"/>
  <text x="876" y="754" font-size="12" font-weight="700" fill="#7A5410">npm registry · pi.dev/packages</text>
  <g font-size="10.5" fill="#4A5568">
    <text x="876" y="778">PI_PACKAGES=npm:pi-web-access auto-install</text>
    <text x="876" y="798">pi-git-status · pi-prompt-trigger (this repo)</text>
    <text x="876" y="818">listed in the gallery via the pi-package keyword</text>
  </g>

  <text x="620" y="890" text-anchor="middle" font-size="10.5" fill="#475569">git-status: live git state per agent in the pi footer · prompt-trigger: watchdog drops a file into ~/pi-exchange/<agent> → delivered as if typed by the user (pi-coding, pi-review)</text>
</svg>
