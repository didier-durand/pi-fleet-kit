      # Watched dir for file-triggered prompts (extension prompt-trigger):
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-exchange/pi-developer:/exchange
      # Skills for THIS agent only:
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/skills/github-best-practices:/repo-skills/github-best-practices:ro
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/skills/write-specifications:/repo-skills/write-specifications:ro
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/skills/write-implementation-plan:/repo-skills/write-implementation-plan:ro
      # Read-only repo mount: extensions stay one git pull away from all
