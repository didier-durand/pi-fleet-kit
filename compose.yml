# Pi agents in Docker, each with an independent configuration.
#
# Fleet root: every host path below derives from PI_FLEET_KIT_HOME (default:
# the host home, $HOME). Expected layout under it:
#   pi-fleet-kit/          this repo (compose, skills, extensions, warp configs)
#   pi-agents/<agent>/     agent workspace clones (bind-mounted as /workspace)
#   pi-exchange/<agent>/   watchdog exchange dirs (bind-mounted as /exchange)
#   .ssh/pi-agent-signing  the agents' SSH signing key
# Export PI_FLEET_KIT_HOME on the host (or set it in .env) to relocate the
# whole fleet; the default keeps the classic layout.
#
# Prerequisite (build once, from the directory containing this file):
#   docker build -t pi-sandbox -f Dockerfile.pi .
#
# (CI also publishes this image as ghcr.io/didier-durand/pi-sandbox,
# multi-arch and verified on every push — private package for now. To run
# the agents on it instead of the local build: docker login ghcr.io, then
# export PI_SANDBOX_IMAGE=ghcr.io/didier-durand/pi-sandbox:latest and add
# image: ${PI_SANDBOX_IMAGE:-pi-sandbox} to the services below.)
#
# Credentials: .env passes the host's OPENROUTER_API_KEY through to the agent
# (Pi's built-in "openrouter" provider reads it). No /login needed inside the
# container unless you prefer per-agent OAuth credentials.
#
# GitHub auth mirrors the host's setup: the GITHUB_TOKEN env var is passed
# through so `gh` and git-over-HTTPS work inside the container exactly as they
# do on the host (no keyring/credential-helper available in the container).
# GITHUB_USER_NAME / GITHUB_USER_EMAIL provide the git commit identity.
#
# Usage (from anywhere; PI_FLEET_KIT_HOME defaults to the host home):
#   docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml run --rm pi-fleet-kit
#   docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml run --rm pi-coding-1
#   docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml run --rm pi-research
#   docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml run --rm pi-personal
#
# Teardown (also deletes volumes / ALL agent state):
#   docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml down -v

name: pi-agents

services:
  # pi-fleet-kit: configuration-management agent. Identical image and credential
  # passthrough, with fully independent state (own Pi home volume, own
  # workspace) so sessions, auth and files never mix with the other agents.
  pi-fleet-kit:
    image: pi-sandbox
    volumes:
      # Private Pi home (config, auth, sessions, extensions):
      - pi-fleet-kit-home:/home/pi/.pi/agent
      # The agent's working folder:
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-agents/pi-fleet-kit:/workspace
      # Skills for THIS agent only (/skill:build-skill, /skill:github-best-practices):
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/skills/build-skill:/repo-skills/build-skill:ro
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/skills/github-best-practices:/repo-skills/github-best-practices:ro
      # Read-only repo mount: extensions stay one git pull away from all
      # agents (git-status is loaded via --extension below):
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/extensions:/repo-extensions:ro
      # Fleet registry + shared fleet-level files (read-only):
      - ${PI_FLEET_KIT_HOME:-$HOME}/pi-fleet-kit/fleet:/fleet:ro
      # Dedicated SSH signing key (host: $PI_FLEET_KIT_HOME/.ssh/pi-agent-signing). Signing-only
      # key registered on GitHub as "Signing key" -> Verified badges.
      - ${PI_FLEET_KIT_HOME:-$HOME}/.ssh/pi-agent-signing:/home/pi/.ssh/signing_key:ro
    environment:
      - OPENROUTER_API_KEY
      # GitHub auth (host passthrough — no need to define these in .env if
      # they are exported in the shell running docker compose):
      - GITHUB_TOKEN
      - GITHUB_USER_NAME
      - GITHUB_USER_EMAIL
      # Pi Packages auto-installed into the agent home on first launch:
      - PI_PACKAGES=npm:pi-web-access
      # pi-obs telemetry DISABLED for this agent: the config manager writes
      # the fleet's own code (compose, extensions, skills) — its turns contain
      # sensitive config content that should not be mirrored to the tracing
      # backend. The pi-obs extension is still loaded (stats commands work);
      # PI_OBS_ENABLED=0 only disables the export pipeline.
      - PI_OBS_ENABLED=0
      # Default model (adjust the model ID to taste), and --continue to resume
      # the most recent session automatically (fresh start: /new inside pi):
    command:
      ["--model", "openrouter/z-ai/glm-5.3-flash", "--continue",
       "--extension", "/repo-extensions/pi-obs/index.ts",
       "--extension", "/repo-extensions/git-status/git-status.ts",
       "--extension", "/repo-extensions/prompt-trigger/prompt-trigger.ts",
       "--skill", "/repo-skills/build-skill",
       "--skill", "/repo-skills/github-best-practices"]
    # Uncomment to reach MCP servers or services running on the host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # pi-coding-1: general-purpose coding agent. Same image and credential
