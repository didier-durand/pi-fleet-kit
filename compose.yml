    # Default model (adjust the model ID to taste), and --continue to resume
    # the most recent session automatically (fresh start: /new inside pi):
    command:
      ["--model", "openrouter/z-ai/glm-5.3-flash", "--continue",
       "--extension", "/repo-extensions/pi-obs/index.ts",
       "--extension", "/repo-extensions/git-status/git-status.ts",
       "--extension", "/repo-extensions/prompt-trigger/prompt-trigger.ts",
       "--skill", "/repo-skills/publishing-best-practices",
       "--skill", "/repo-skills/hello-world",
       "--skill", "/repo-skills/github-best-practices"]
    # Uncomment to reach MCP servers or services running on the host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Jaeger v2 (all-in-one): OTel collector + query + UI in one container.
  # Agents export traces/metrics/logs via OTLP/HTTP to http://otlp-jaeger:4318
  # (compose network). The UI is mapped to host port 16686 for browser
  # access. In-memory storage: data is lost on restart — sufficient for
  # the fleet's live-observability use case (not a persistence backend).
  # Start with: docker compose -f $PI_FLEET_KIT_HOME/pi-fleet-kit/compose.yml up -d otlp-jaeger
  # UI: http://localhost:16686
  otlp-jaeger:
    image: jaegertracing/jaeger:latest
    container_name: otlp-jaeger
    # Restart on crash (not on explicit stop): the OTLP backend should be
    # self-healing — if it crashes, Docker brings it back within seconds.
    restart: unless-stopped
    # Jaeger v2 requires an explicit --config (OTel Collector format).
    # The config adds metrics/logs pipelines (the default only has traces,
    # which 404s pi-obs's /v1/metrics and /v1/logs requests).
    # Badger storage persists traces across restarts (24h TTL).
    volumes:
      - otlp-jaeger-data:/data
      - ./config/otelcol-jaeger.yaml:/jaeger/config.yaml:ro
    command: ["--config", "/jaeger/config.yaml"]
    ports:
      # Jaeger UI — open http://localhost:16686 in the host browser.
      # Only this port needs host mapping; agents reach the OTLP
      # collector over the compose network (service name `otlp-jaeger`),
      # not via host ports.
      - "16686:16686"
      # OTLP/HTTP — uncomment to expose to the host (e.g. for the
      # pi-obs test scripts running outside Docker):
      # - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    # NOT labeled pi.agent.fleet=1: this is infrastructure, not an agent.
    # docker compose run --rm otlp-jaeger would be wrong (it is a daemon).

volumes:
  otlp-jaeger-data:
  pi-fleet-kit-home:
  pi-developer-home:
  pi-coding-1-home:
  pi-coding-2-home:
  pi-review-1-home:
  pi-review-2-home:
  pi-research-home:
  pi-personal-home:
