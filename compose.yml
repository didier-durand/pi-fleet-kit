# Pi agents in Docker, each with an independent configuration.
#
# Prerequisite (build once, from the directory containing this file):
#   docker build -t pi-sandbox -f Dockerfile.pi .
#
# Credentials: .env passes the host's OPENROUTER_API_KEY through to the agent
# (Pi's built-in "openrouter" provider reads it). No /login needed inside the
# container unless you prefer per-agent OAuth credentials.
#
# GitHub auth mirrors the host's setup: the GITHUB_TOKEN env var is passed
# through so `gh` and git-over-HTTPS work inside the container exactly as they
# do on the host (no keyring/credential-helper available in the container).
# GITHUB_USER_NAME / GITHUB_USER_EMAIL provide the git commit identity.
#
# Usage:
#   docker compose -f ~/pi-configs/compose.yml run --rm pi-configs
#   docker compose -f ~/pi-configs/compose.yml run --rm pi-coding
#   docker compose -f ~/pi-configs/compose.yml run --rm pi-research
#   docker compose -f ~/pi-configs/compose.yml run --rm pi-personal
#
# Teardown (also deletes volumes / ALL agent state):
#   docker compose -f ~/pi-configs/compose.yml down -v

name: pi-agents

services:
  # pi-configs: configuration-management agent. Identical image and credential
  # passthrough, with fully independent state (own Pi home volume, own
  # workspace) so sessions, auth and files never mix with the other agents.
  pi-configs:
    image: pi-sandbox
    volumes:
      # Private Pi home (config, auth, sessions, extensions):
      - pi-configs-home:/home/pi/.pi/agent
      # The agent's working folder:
      - ${HOME}/pi-agents/pi-configs:/workspace
      # Watched dir for file-triggered prompts (extension prompt-trigger):
      # Exchange dir: watchdog drops prompt files here; per-agent so no
      # agent sees another agent's exchanges
      - ${HOME}/pi-exchange/pi-configs:/exchange
      # Skills for THIS agent only (/skill:build-skill, /skill:github-best-practices):
      - ${HOME}/pi-configs/skills/build-skill:/repo-skills/build-skill:ro
      - ${HOME}/pi-configs/skills/github-best-practices:/repo-skills/github-best-practices:ro
      # Read-only repo mount: extensions stay one git pull away from all
      # agents (git-status is loaded via --extension below):
      - ${HOME}/pi-configs/extensions:/repo-extensions:ro
      # Dedicated SSH signing key (host: ~/.ssh/pi-agent-signing). Signing-only
      # key registered on GitHub as "Signing key" -> Verified badges.
      - ${HOME}/.ssh/pi-agent-signing:/home/pi/.ssh/signing_key:ro
    environment:
      - OPENROUTER_API_KEY
      # GitHub auth (host passthrough — no need to define these in .env if
      # they are exported in the shell running docker compose):
      - GITHUB_TOKEN
      - GITHUB_USER_NAME
      - GITHUB_USER_EMAIL
      # Pi Packages auto-installed into the agent home on first launch:
      - PI_PACKAGES=npm:pi-web-access
      - PI_TRIGGER_DIR=/exchange
    # Default model (adjust the model ID to taste), and --continue to resume
    # the most recent session automatically (fresh start: /new inside pi):
    command:
      ["--model", "openrouter/z-ai/glm-5.3-flash", "--continue",
       "--extension", "/repo-extensions/git-status/git-status.ts",
       "--extension", "/repo-extensions/prompt-trigger/prompt-trigger.ts",
       "--skill", "/repo-skills/build-skill",
       "--skill", "/repo-skills/github-best-practices"]
    # Uncomment to reach MCP servers or services running on the host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

