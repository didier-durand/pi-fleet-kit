name: pi-obs-unit-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extensions/pi-obs/**"
      - "utils/run-tests.sh"
      - ".github/workflows/pi-obs-unit-tests.yml"
  pull_request:
    paths:
      - "extensions/pi-obs/**"
      - "utils/run-tests.sh"
      - ".github/workflows/pi-obs-unit-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs the coverage-gated unit suite (tests/unit — the package's own
      # "unit" level) under c8 and writes the per-file coverage report to
      # the job summary. tests/live (needs pi + OPENROUTER_API_KEY, and
      # corrupts V8 coverage by design) and tests/cli (child-process spawns,
      # same coverage-corruption issue) are deliberately excluded — they run
      # via the package's own test_pi_obs.sh suite, not this workflow.
      - name: Unit tests + coverage
        run: utils/run-tests.sh pi-obs "tests/unit/**/*.test.ts"
