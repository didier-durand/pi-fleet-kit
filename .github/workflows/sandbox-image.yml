name: pi-sandbox image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile.pi"
      - "utils/entrypoint.sh"
      - ".github/workflows/sandbox-image.yml"

# Publish to GHCR (github packages) as ghcr.io/<owner>/pi-sandbox.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built via emulation on the amd64 runner
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: branch name (main), semver from v* tags, the commit SHA
      # (every build addressable), and latest on the default branch.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-sandbox
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- post-push verification: pull back from GHCR and run ---------
      # Pulling by digest proves the image is downloadable from GHCR
      # (auth, manifest, blob serving) rather than relying on the runner's
      # local build cache. Running it proves the sandbox actually works:
      # entrypoint + pi binary + the toolchain agents depend on. arm64 runs
      # under the QEMU emulation set up above. All results accumulate in
      # /tmp/job-summary.md, written to the job summary at the end.
      - name: Start the verification report
        run: |
          {
            echo "## 📦 pi-sandbox image — build & verification report"
            echo
            echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/pi-sandbox\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Tags:** $(echo "$TAGS" | tr '\n' ' ')"
            echo
            echo "| Result | Check | Platform | Detail |"
            echo "|---|---|---|---|"
            echo "| ✅ | Built and pushed | linux/amd64 + linux/arm64 | multi-arch push to GHCR |"
          } > /tmp/job-summary.md
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Pull the pushed image from GHCR (amd64)
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          echo "| ✅ | Downloaded from GHCR | linux/amd64 | digest pull |" >> /tmp/job-summary.md

      - name: Pull the pushed image from GHCR (arm64)
        run: |
          docker pull --platform linux/arm64 ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          echo "| ✅ | Downloaded from GHCR | linux/arm64 | digest pull (--platform) |" >> /tmp/job-summary.md

      - name: Smoke-run the pulled image (amd64)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          PI_OUT=$(docker run --rm --platform linux/amd64 "$IMG" --version)
          echo "pi --version -> $PI_OUT"
          test -n "$PI_OUT"
          TOOLS=$(docker run --rm --platform linux/amd64 --entrypoint bash "$IMG" -c 'git --version && gh --version && node --version')
          echo "$TOOLS"
          echo "$TOOLS" | grep -q "git version"
          {
            echo "| ✅ | Entrypoint smoke run (\`pi --version\`) | linux/amd64 | $PI_OUT |"
            echo "| ✅ | Toolchain present | linux/amd64 | $(echo "$TOOLS" | tr '\n' ' · ') |"
          } >> /tmp/job-summary.md

      - name: Smoke-run the pulled image (arm64, emulated)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          PI_OUT=$(docker run --rm --platform linux/arm64 "$IMG" --version)
          echo "pi --version (arm64) -> $PI_OUT"
          test -n "$PI_OUT"
          echo "| ✅ | Entrypoint smoke run (\`pi --version\`) | linux/arm64 (QEMU) | $PI_OUT |" >> /tmp/job-summary.md

      - name: Write the verification report to the job summary
        if: always()
        run: |
          cat /tmp/job-summary.md
          echo
          cat /tmp/job-summary.md >> "${GITHUB_STEP_SUMMARY}"
