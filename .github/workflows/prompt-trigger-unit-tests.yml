name: prompt-trigger-unit-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extensions/prompt-trigger/**"
      - "utils/run-tests.sh"
      - ".github/workflows/prompt-trigger-unit-tests.yml"
  pull_request:
    paths:
      - "extensions/prompt-trigger/**"
      - "utils/run-tests.sh"
      - ".github/workflows/prompt-trigger-unit-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs node --test (with module mocking for the fs-race scenarios)
      # under c8 and writes the coverage report to the job summary. No API
      # key needed: the tests are hermetic (real temp dirs, mocked timers).
      - name: Unit tests + coverage
        run: utils/run-tests.sh prompt-trigger
