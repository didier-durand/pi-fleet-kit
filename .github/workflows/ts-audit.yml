name: ts-audit

on:
  schedule:
    # 05:00 CET (UTC+1). GitHub cron is UTC-only, so this fires at 06:00
    # during CEST (DST) — accepted drift, documented here.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ts-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is intentionally gitignored in this repo, so npm ci
      # is not possible here; npm install resolves from the devDependencies
      # ranges in utils/ts-audit/package.json.
      - name: Install audit tooling
        working-directory: utils/ts-audit
        run: npm install --no-fund --no-audit

      - name: Run audit
        working-directory: utils/ts-audit
        run: node audit.mjs
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Commit report if changed
        run: |
          # NOTE: plain `git diff` cannot see untracked files — the timestamped
          # archive is brand-new every run, so diff on TRACKED content only for
          # the short-circuit, then `git add` the whole audits dir to capture
          # the new archive.
          if git diff --quiet README.md docs/audits/ts-audit.md; then
            echo "No report changes since last run — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/audits
          git commit -m "ts-audit: daily report $(date -u +%F) [skip ci]"
          git push
