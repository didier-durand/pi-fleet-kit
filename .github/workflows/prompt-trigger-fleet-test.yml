name: prompt-trigger-fleet-test

# Fleet bring-up test on a GitHub runner: the full compose fleet (8 agents
# + the observability backend) comes up exactly as configured, and every
# agent is validated end-to-end — full compose command (model, extensions,
# skills), a real prompt, an OpenRouter round-trip, and the complete OTLP
# capture validated from a standard OTel Collector's file export.
#
# Telemetry backend in CI: a standard OpenTelemetry Collector REPLACES the
# otlp-jaeger service via a compose OVERRIDE file (CI-only plumbing — the
# stored compose.yml is untouched). The collector exports all three signals
# (traces, metrics, logs) to a file on the runner: push-based, deterministic
# assertions on raw OTLP — no query-API polling, no storage semantics.
# Jaeger stays the operator's UI in production; CI wants files, not UIs.
#
# Mechanism: with piped stdin and no TTY (docker compose run -T), pi uses
# print mode automatically and prepends the piped content as the first
# prompt — so the compose `command:` runs unmodified.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [build-sandbox-image]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      - name: Skip without credentials
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::notice::OPENROUTER_API_KEY not configured — skipping fleet bring-up test" && exit 0

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Point PI_FLEET_KIT_HOME at the checkout
        run: echo "PI_FLEET_KIT_HOME=$(dirname "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      # CI-only compose override: the otlp-jaeger service becomes a standard
      # OTel Collector with a file exporter (all three signals). Agents keep
      # exporting to http://otlp-jaeger:4318 (service-name DNS unchanged).
      - name: Prepare the collector override + config
        run: |
          mkdir -p /tmp/otel-capture
          cat > /tmp/ci-otelcol.yaml <<'YAML'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                grpc:
                  endpoint: 0.0.0.0:4317
          exporters:
            file:
              path: /data/otel-capture.jsonl
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133   # default binds the container's loopback — unreachable via the mapped port
          service:
            extensions: [health_check]
            telemetry:
              logs:
                level: warn
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [file]
              metrics:
                receivers: [otlp]
                exporters: [file]
              logs:
                receivers: [otlp]
                exporters: [file]
          YAML
          cat > /tmp/ci-otelcol-override.yml <<'YAML'
          services:
            otlp-jaeger:
              image: otel/opentelemetry-collector-contrib:latest
              # the collector image runs as UID 10001 — the runner-side bind
              # mount is owned by the runner user; write as root instead
              user: "0"
              command: ["--config", "/etc/otelcol/config.yaml"]
              volumes:
                - /tmp/otel-capture:/data
                - /tmp/ci-otelcol.yaml:/etc/otelcol/config.yaml:ro
              ports:
                - "13133:13133"
          YAML
          echo "COMPOSE_FILES=-f $GITHUB_WORKSPACE/compose.yml -f /tmp/ci-otelcol-override.yml" >> "$GITHUB_ENV"

      - name: Start the collector (as the otlp-jaeger service)
        run: |
          docker compose $COMPOSE_FILES up -d otlp-jaeger
          echo "=== collector state: $(docker inspect otlp-jaeger --format '{{.State.Status}} exit={{.State.ExitCode}}' 2>/dev/null)"
          docker logs otlp-jaeger --tail 30 2>&1 | head -25 || true
          # the collector's own health check — proves it RUNS, not just exists
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13133 || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          [ "$CODE" = "200" ] || { echo "collector health check failed (last: $CODE)" >&2; exit 1; }
          echo "| ✅ | OTel Collector up (replaces otlp-jaeger in CI via compose override) | health check 200 on :13133 |" >> /tmp/fleet-rows.md

      - name: Bring up every agent and validate its LLM round-trip
        run: |
          for agent in pi-fleet-kit pi-developer pi-coding-1 pi-coding-2 pi-review-1 pi-review-2 pi-research pi-personal; do
            echo "=== $agent"
            OUT=$(echo "Reply with exactly: OK" | timeout 180 \
              docker compose -f "$GITHUB_WORKSPACE/compose.yml" -f /tmp/ci-otelcol-override.yml run -T --rm "$agent" 2>&1 | tail -5)
            echo "$OUT"
            if echo "$OUT" | grep -q "OK"; then
              echo "| ✅ | \`$agent\` | compose config loaded (extensions + skills + model) — LLM answered OK |" >> /tmp/fleet-rows.md
            else
              echo "| ❌ | \`$agent\` | no OK in response: $(echo "$OUT" | tail -1) |" >> /tmp/fleet-rows.md
            fi
            sleep 4   # exporter flush window; avoid rate bursts
          done

      - name: Validate the OTLP capture (collector file export)
        run: |
          sleep 5   # collector file-exporter flush margin
          CAPTURE=/tmp/otel-capture/otel-capture.jsonl
          [ -s "$CAPTURE" ] || { echo "collector exported nothing — capture file missing/empty" >&2; exit 1; }
          echo "capture size: $(wc -c < "$CAPTURE") bytes, $(wc -l < "$CAPTURE") export batches"
          # per-service span/metric/log counts from the raw OTLP batches
          node -e '
          const fs = require("fs");
          const lines = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
          const stats = {};
          for (const line of lines) {
            let doc; try { doc = JSON.parse(line); } catch { continue; }
            for (const rs of doc.resourceSpans ?? []) {
              const svc = (rs.resource?.attributes ?? []).find(a => a.key === "service.name")?.value?.stringValue ?? "?";
              const n = (rs.scopeSpans ?? []).flatMap(s => s.spans ?? []).length;
              stats[svc] = stats[svc] ?? { spans: 0, metrics: 0, logs: 0 };
              stats[svc].spans += n;
            }
            for (const rm of doc.resourceMetrics ?? []) {
              const svc = (rm.resource?.attributes ?? []).find(a => a.key === "service.name")?.value?.stringValue ?? "?";
              const n = (rm.scopeMetrics ?? []).flatMap(s => s.metrics ?? []).length;
              stats[svc] = stats[svc] ?? { spans: 0, metrics: 0, logs: 0 };
              stats[svc].metrics += n;
            }
            for (const rl of doc.resourceLogs ?? []) {
              const svc = (rl.resource?.attributes ?? []).find(a => a.key === "service.name")?.value?.stringValue ?? "?";
              const n = (rl.scopeLogs ?? []).flatMap(s => s.logRecords ?? []).length;
              stats[svc] = stats[svc] ?? { spans: 0, metrics: 0, logs: 0 };
              stats[svc].logs += n;
            }
          }
          fs.writeFileSync("/tmp/otel-stats.json", JSON.stringify(stats, null, 0));
          console.log(JSON.stringify(stats, null, 1));
          ' "$CAPTURE"
          # every telemetry-active agent must have spans AND metrics in the capture;
          # logs = 0 is HEALTHY (pi-obs emits log records only for faults —
          # exporter failures, drops — so a clean run carries none)
          for agent in pi-developer pi-coding-1 pi-coding-2 pi-review-1 pi-review-2 pi-research pi-personal; do
            read -r SP MN LG <<< "$(node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/otel-stats.json','utf8'))['pi-agent-$agent']??{};console.log(s.spans??0, s.metrics??0, s.logs??0)")"
            S="$SP spans · $MN metrics · $LG logs"
            if [ "${SP:-0}" -gt 0 ] && [ "${MN:-0}" -gt 0 ]; then
              if [ "${LG:-0}" -eq 0 ]; then
                echo "| ✅ | OTLP capture: \`pi-agent-$agent\` | $S (0 logs = no faults — healthy) |" >> /tmp/fleet-rows.md
              else
                echo "| ⚠️ | OTLP capture: \`pi-agent-$agent\` | $S ($LG fault log record(s) — see capture) |" >> /tmp/fleet-rows.md
              fi
            else
              echo "| ❌ | OTLP capture: \`pi-agent-$agent\` | incomplete: $S |" >> /tmp/fleet-rows.md
            fi
          done
          echo "| ℹ️ | pi-fleet-kit exports nothing (PI_OBS_ENABLED=0, by design) | |" >> /tmp/fleet-rows.md

      - name: Teardown
        if: always()
        run: docker compose $COMPOSE_FILES down -v --remove-orphans || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🚀 Fleet bring-up test — compose on the runner (OTel Collector capture)"
            echo
            echo "Image: \`ghcr.io/${{ github.repository_owner }}/pi-sandbox:latest\` · model: \`$OPENROUTER_MODEL\`"
            echo
            echo "| Result | Agent / Check | Detail |"
            echo "|---|---|---|"
            cat /tmp/fleet-rows.md 2>/dev/null || echo "| ❌ | (workflow failed before any agent ran) | see job logs |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
