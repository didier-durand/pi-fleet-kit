                  const attr = k => (s.attributes ?? []).find(a => a.key === k)?.value?.stringValue;
                  if (s.name === "pi.model") m.modelTexts.push(attr("pi.content.text") ?? "");
                  if (s.name === "pi.tool bash") m.bashResults.push(attr("pi.tool.result") ?? "");
                  for (const e of s.events ?? []) {
