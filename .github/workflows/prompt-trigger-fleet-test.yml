          ' "$CAPTURE" >> /tmp/fleet-rows.md || { cat /tmp/fleet-rows.md | tail -4; echo "OTLP span analysis failed" >&2; exit 1; }
          # the simple exchange, proven in the spans: pi-fleet-kit has model
          # spans AND a bash tool span whose captured result carries the
          # "sent:" envelope write (the LLM ran send.sh through the tool);
          # pi-developer received the delivered prompt as user input and a
