          const senderSessionId = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).session_id;
          const sessionLinks = [];
          for (const line of lines) {
            let rec; try { rec = JSON.parse(line); } catch { continue; }
            const docs = [rec];
            if (rec && rec.body !== undefined) docs.push(rec.body);
