          # the attachment dialog, step by step, proven in the spans:
          #   1. question file created   — pi-fleet-kit bash span writes /tmp/mailbox-question.txt
          #   2. request sent            — pi-fleet-kit bash span result carries "sent:"; header lists the file
          #   3. delivered + file read   — pi.user.input carries the manifest line; pi-developer bash result carries the question
          #   4. answered                — the latest pi.model span answers 15 (the correlated reply confirms host-side)
          #   5. distributed trace       — pi-developer session span links to the sender trace (pi.mailbox.session_id)
          node -e '
          const fs = require("fs");
          const lines = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
          const env = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const senderSessionId = env.session_id;
          const attachmentName = env.attachments[0].name;
          const byService = {};
          const modelTimeline = []; // {service, start, text} — for the chronological latest answer
          for (const line of lines) {
            let rec; try { rec = JSON.parse(line); } catch { continue; }
            const docs = [rec];
            if (rec && rec.body !== undefined) docs.push(rec.body);
            for (const doc of docs) {
              let d = doc;
              if (typeof d === "string") { try { d = JSON.parse(d); } catch { continue; } }
              if (!d || typeof d !== "object") continue;
              for (const rs of d.resourceSpans ?? []) {
                const svc = (rs.resource?.attributes ?? []).find(a => a.key === "service.name")?.value?.stringValue ?? "?";
                for (const ss of rs.scopeSpans ?? []) for (const s of ss.spans ?? []) {
                  const m = byService[svc] = byService[svc] ?? { modelTexts: [], bashInputs: [], bashResults: [], userInputs: [] };
                  const attr = k => (s.attributes ?? []).find(a => a.key === k)?.value?.stringValue;
                  if (s.name === "pi.model") {
                    const text = attr("pi.content.text") ?? "";
                    m.modelTexts.push(text);
                    modelTimeline.push({ svc, start: String(s.startTimeUnixNano ?? ""), text });
                  }
                  if (s.name === "pi.tool bash") {
                    m.bashInputs.push(attr("pi.tool.input") ?? "");
                    m.bashResults.push(attr("pi.tool.result") ?? "");
                  }
                  for (const e of s.events ?? []) {
                    const t = (e.attributes ?? []).find(a => a.key === "pi.content.text")?.value?.stringValue;
                    if (e.name === "pi.user.input" && t) m.userInputs.push(t);
                  }
                }
              }
            }
          }
          const fk = byService["pi-agent-pi-fleet-kit"] ?? { modelTexts: [], bashInputs: [], bashResults: [], userInputs: [] };
          const dv = byService["pi-agent-pi-developer"] ?? { modelTexts: [], bashInputs: [], bashResults: [], userInputs: [] };
          const row = (ok, label, detail) => console.log(`| ${ok ? "✅" : "❌"} | ${label} | ${detail} |`);
          const created = fk.bashInputs.some(t => t.includes("mailbox-question.txt"));
          const sent = fk.bashResults.some(t => t.includes("sent:"));
          const delivered = dv.userInputs.some(t => t.includes("mailbox attachments"));
          const read = dv.bashResults.some(t => t.includes("how much is 7 + 8"));
          modelTimeline.sort((x, y) => x.start.localeCompare(y.start));
          const lastDeveloper = [...modelTimeline].reverse().find(x => x.svc === "pi-agent-pi-developer");
          const answered = lastDeveloper !== undefined && /\b15\b/.test(lastDeveloper.text);
          const links = [];
          for (const line of lines) {
            let rec; try { rec = JSON.parse(line); } catch { continue; }
            const docs = [rec];
            if (rec && rec.body !== undefined) docs.push(rec.body);
            for (const doc of docs) {
              let d = doc;
              if (typeof d === "string") { try { d = JSON.parse(d); } catch { continue; } }
              if (!d || typeof d !== "object") continue;
              for (const rs of d.resourceSpans ?? []) {
                const svc = (rs.resource?.attributes ?? []).find(a => a.key === "service.name")?.value?.stringValue ?? "?";
                for (const ss of rs.scopeSpans ?? []) for (const s of ss.spans ?? []) {
                  if (s.name !== "pi.session" || svc !== "pi-agent-pi-developer") continue;
                  for (const link of s.links ?? []) {
                    const sid = (link.attributes ?? []).find(a => a.key === "pi.mailbox.session_id")?.value?.stringValue;
                    if (sid !== undefined) links.push(sid);
                  }
                }
              }
            }
          }
          const linked = links.includes(senderSessionId);
          row(created, "attachment dialog step 1/5 — question file created",
              `a pi-fleet-kit bash span writes /tmp/${attachmentName} (tool input captured)`);
          row(sent, "attachment dialog step 2/5 — request sent with the attachment",
              "a pi-fleet-kit bash span result carries the sent: envelope write; the header lists name + bytes + sha256");
          row(delivered && read, "attachment dialog step 3/5 — delivered and read",
              "pi.user.input carries the manifest line; a pi-developer bash span result carries the question text");
          row(answered, "attachment dialog step 4/5 — answered",
              `the latest pi.model span of the dialog answers 15 (host-side, the correlated reply body confirms)`);
          row(linked, "attachment dialog step 5/5 — distributed trace",
              `the pi-developer session span links to the sender trace (pi.mailbox.session_id = ${senderSessionId})`);
          if (!created || !sent || !delivered || !read || !answered || !linked) process.exit(1);
          ' "$CAPTURE" "$ATT_REQ_FILE" >> /tmp/fleet-rows.md || { cat /tmp/fleet-rows.md | tail -6; echo "attachment-dialog OTLP assertions failed" >&2; exit 1; }

