name: pi-sandbox-daily-build

# Daily scheduled build of the pi-sandbox image (04:00 UTC).
# Ensures the GHCR image stays fresh even without pushes to main —
# picks up base image updates (node:24-bookworm-slim, apt packages)
# and rebuilds with the current repo state.

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-sandbox
          tags: |
            type=raw,value=daily
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the pushed image from GHCR (amd64)
        run: docker pull ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}

      - name: Pull the pushed image from GHCR (arm64)
        run: docker pull --platform linux/arm64 ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}

      - name: Smoke-run the pulled image (amd64)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          PI_OUT=$(docker run --rm --platform linux/amd64 "$IMG" --version)
          echo "pi --version -> $PI_OUT"
          test -n "$PI_OUT"
          TOOLS=$(docker run --rm --platform linux/amd64 --entrypoint bash "$IMG" -c 'git --version && gh --version && node --version')
          echo "$TOOLS"
          echo "$TOOLS" | grep -q "git version"

      - name: Smoke-run the pulled image (arm64, emulated)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/pi-sandbox@${{ steps.build.outputs.digest }}
          PI_OUT=$(docker run --rm --platform linux/arm64 "$IMG" --version)
          echo "pi --version (arm64) -> $PI_OUT"
          test -n "$PI_OUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 📦 pi-sandbox daily build — $(date -u +%Y-%m-%d)"
            echo
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Tags:** $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
