name: prompt-trigger-check-sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extensions/prompt-trigger/**"
      - "utils/check-extension.sh"
      - ".github/workflows/prompt-trigger-check-sanity.yml"
  pull_request:
    paths:
      - "extensions/prompt-trigger/**"
      - "utils/check-extension.sh"
      - ".github/workflows/prompt-trigger-check-sanity.yml"

jobs:
  sanity:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The smoke test needs the pi binary; install it only when the key is
      # configured — key-less forks skip it (the script gates on both).
      - name: Install pi for the smoke test
        if: env.OPENROUTER_API_KEY != ''
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      # The live-load smoke test runs only if the secret is configured;
      # without it the script skips step 5 and the static checks still gate.
      - name: Sanity checks
        run: utils/check-extension.sh prompt-trigger
